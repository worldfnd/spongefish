[package]
name = "provekit-spongefish-derive"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "spongefish_derive"
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["derive"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
spongefish = { package = "provekit-spongefish", version = "=0.2.1", path = "../spongefish", default-features = false, features = ["sha3"] }
